<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistamark Intel — Query</title>
<style>
  :root {
    --navy: #1a2c4e;
    --navy-light: #2c4670;
    --navy-bg: #eef2f7;
    --gold: #c9a04e;
    --bg: #f7f8fa;
    --surface: #fff;
    --border: #e5e7eb;
    --text: #1a1a1a;
    --text-muted: #6b7280;
    --error: #dc2626;
    --success: #059669;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.05);
  }
  .brand { font-weight: 600; font-size: 16px; letter-spacing: .3px; }
  .brand-gold { color: var(--gold); }
  header button {
    background: transparent; color: white;
    border: 1px solid rgba(255,255,255,.3);
    padding: 6px 12px; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  header button:hover { background: rgba(255,255,255,.1); }
  main {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: calc(100vh - 53px);
  }
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px 0;
  }
  .category {
    padding: 12px 20px 4px;
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .tool-link {
    display: block; padding: 8px 20px;
    color: var(--text); text-decoration: none;
    cursor: pointer; font-size: 13px;
    border-left: 3px solid transparent;
    transition: background .12s;
  }
  .tool-link:hover { background: var(--bg); }
  .tool-link.active {
    background: var(--navy-bg);
    border-left-color: var(--gold);
    font-weight: 500;
  }
  section.pane { overflow-y: auto; padding: 24px 32px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--navy); }
  .tool-desc { color: var(--text-muted); margin: 0 0 20px; font-size: 13px; }
  form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; }
  .field label {
    font-size: 12px; font-weight: 500;
    color: var(--text-muted); margin-bottom: 4px;
  }
  .field label .req { color: var(--gold); margin-left: 2px; }
  .field input, .field select {
    border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 10px; font-size: 13px;
    background: var(--surface);
    font-family: inherit;
  }
  .field input:focus, .field select:focus {
    outline: none; border-color: var(--navy);
    box-shadow: 0 0 0 2px rgba(26,44,78,.12);
  }
  .field-tip { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .submit-row {
    margin-top: 16px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  button.primary {
    background: var(--navy); color: white;
    border: none; padding: 8px 18px; border-radius: 4px;
    cursor: pointer; font-size: 13px; font-weight: 500;
  }
  button.primary:hover { background: var(--navy-light); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary {
    background: transparent; color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 4px;
    cursor: pointer; font-size: 13px;
  }
  button.secondary:hover { background: var(--bg); }
  .results {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
  }
  .results-header {
    display: flex; justify-content: space-between;
    margin-bottom: 12px; align-items: center; flex-wrap: wrap; gap: 8px;
  }
  .results-summary { font-size: 13px; color: var(--text-muted); }
  .view-toggle { display: flex; gap: 4px; }
  .view-toggle button {
    background: transparent; border: 1px solid var(--border);
    padding: 4px 12px; font-size: 12px;
    cursor: pointer; border-radius: 3px;
  }
  .view-toggle button.active {
    background: var(--navy); color: white; border-color: var(--navy);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 8px;
    background: #f9fafb;
    border-bottom: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .3px;
    position: sticky; top: 0; cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--navy); }
  thead th .sort-ind { color: var(--gold); margin-left: 4px; }
  tbody td {
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 260px;
  }
  tbody tr:hover { background: #f9fafb; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  pre.json {
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px; font-size: 12px;
    overflow: auto; max-height: 600px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal[hidden] { display: none; }
  .modal-content {
    background: var(--surface);
    padding: 24px; border-radius: 6px;
    width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  .modal-content h3 { margin: 0 0 8px; color: var(--navy); }
  .modal-content p { font-size: 13px; color: var(--text-muted); margin: 0 0 14px; }
  .modal-content input {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 4px;
    font-size: 14px; margin-bottom: 12px; font-family: ui-monospace, Menlo, monospace;
  }
  .modal-content button.primary { width: 100%; padding: 10px; }
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 8px; }
  .error-banner {
    background: #fef2f2; border: 1px solid #fecaca;
    color: var(--error); padding: 12px; border-radius: 4px;
    margin-bottom: 16px; font-size: 13px;
  }
  .loading {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--gold); border-top-color: transparent;
    border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .kv {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 8px 20px; font-size: 13px;
  }
  .kv dt { color: var(--text-muted); font-weight: 500; }
  .kv dd { margin: 0; word-break: break-word; }
  .footer-note {
    margin-top: 24px; font-size: 11px; color: var(--text-muted); text-align: center;
  }
  .footer-note a { color: var(--navy); }
</style>
</head>
<body>
<header>
  <div class="brand">Vistamark Intel<span class="brand-gold"> · Query</span></div>
  <div>
    <span id="server-version" style="opacity:.6;margin-right:12px;font-size:12px;"></span>
    <button id="signout">Sign out</button>
  </div>
</header>

<main>
  <aside id="tool-list">
    <div class="empty-state"><span class="loading"></span>Loading tools…</div>
  </aside>
  <section class="pane" id="pane">
    <div class="empty-state">
      <div class="icon">←</div>
      Select a tool from the sidebar to begin.
    </div>
  </section>
</main>

<div class="modal" id="auth-modal" hidden>
  <div class="modal-content">
    <h3>Sign in to Vistamark Intel</h3>
    <p>Paste your <code>ACCESS_TOKEN</code>. Stored only for this tab session.</p>
    <input id="token-input" type="password" placeholder="ACCESS_TOKEN" autocomplete="off">
    <button id="auth-submit" class="primary">Sign in</button>
    <div id="auth-error" style="color:var(--error);font-size:12px;margin-top:10px;display:none;"></div>
  </div>
</div>

<script>
// ============================================================
// Vistamark Intel — Query UI
// ============================================================
const API = "/api/mcp";
const TOKEN_KEY = "vistamark_intel_token";

const CATEGORY_MAP = {
  // RIA tools (Form ADV)
  search_rias: "RIA Intelligence",
  get_ria_profile: "RIA Intelligence",
  search_advisors: "RIA Intelligence",
  find_alumni: "RIA Intelligence",
  get_aum_history: "RIA Intelligence",
  firms_using_custodian: "RIA Intelligence",
  top_rias_by: "RIA Intelligence",
  // Nonprofit tools
  irs_eo_lookup: "Nonprofit",
  irs_eo_search: "Nonprofit",
  propublica_org_search: "Nonprofit",
  propublica_org_990: "Nonprofit",
  // System
  database_status: "System",
};

const CATEGORY_ORDER = ["RIA Intelligence", "Nonprofit", "System", "Other"];

let tools = [];
let currentTool = null;
let currentResult = null;
let currentView = "table";
let currentSort = { col: null, dir: "desc" };

// ============================================================
// Auth
// ============================================================
const getToken = () => sessionStorage.getItem(TOKEN_KEY);
const setToken = t => sessionStorage.setItem(TOKEN_KEY, t);
const clearToken = () => sessionStorage.removeItem(TOKEN_KEY);

function showAuthModal() {
  document.getElementById("auth-modal").hidden = false;
  setTimeout(() => document.getElementById("token-input").focus(), 50);
}
function hideAuthModal() {
  document.getElementById("auth-modal").hidden = true;
  document.getElementById("auth-error").style.display = "none";
}

document.getElementById("auth-submit").onclick = async () => {
  const token = document.getElementById("token-input").value.trim();
  if (!token) return;
  setToken(token);
  try {
    await loadTools();
    hideAuthModal();
  } catch (e) {
    clearToken();
    const err = document.getElementById("auth-error");
    err.textContent = "Sign-in failed — " + e.message;
    err.style.display = "block";
  }
};

document.getElementById("token-input").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("auth-submit").click();
});

document.getElementById("signout").onclick = () => {
  clearToken();
  location.reload();
};

// ============================================================
// JSON-RPC client
// ============================================================
async function rpc(method, params = {}) {
  const token = getToken();
  if (!token) {
    showAuthModal();
    throw new Error("No token");
  }
  let res;
  try {
    res = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "ACCESS_TOKEN": token,
      },
      body: JSON.stringify({
        jsonrpc: "2.0",
        id: Date.now(),
        method,
        params,
      }),
    });
  } catch (e) {
    throw new Error("Network error — " + e.message);
  }
  if (res.status === 401) {
    clearToken();
    showAuthModal();
    throw new Error("Unauthorized");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error.message);
  return json.result;
}

// ============================================================
// Tool loading + sidebar
// ============================================================
async function loadTools() {
  const result = await rpc("tools/list");
  tools = result.tools || [];
  renderSidebar();
  // Restore tool selection from URL
  const params = new URLSearchParams(location.search);
  const toolParam = params.get("tool");
  if (toolParam) {
    const t = tools.find(x => x.name === toolParam);
    if (t) selectTool(t, params);
  }
}

function renderSidebar() {
  const aside = document.getElementById("tool-list");
  const groups = {};
  for (const t of tools) {
    const cat = CATEGORY_MAP[t.name] || "Other";
    (groups[cat] = groups[cat] || []).push(t);
  }
  let html = "";
  for (const cat of CATEGORY_ORDER) {
    if (!groups[cat]) continue;
    html += `<div class="category">${cat}</div>`;
    for (const t of groups[cat].sort((a, b) => a.name.localeCompare(b.name))) {
      html += `<a class="tool-link" data-tool="${t.name}">${prettyName(t.name)}</a>`;
    }
  }
  aside.innerHTML = html;
  aside.querySelectorAll(".tool-link").forEach(a => {
    a.onclick = () => {
      const t = tools.find(x => x.name === a.dataset.tool);
      if (t) selectTool(t);
    };
  });
}

function prettyName(name) {
  return name.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
}

// ============================================================
// Form rendering
// ============================================================
function selectTool(tool, presetParams = null) {
  currentTool = tool;
  currentResult = null;
  currentSort = { col: null, dir: "desc" };

  document.querySelectorAll(".tool-link").forEach(a => {
    a.classList.toggle("active", a.dataset.tool === tool.name);
  });

  const pane = document.getElementById("pane");
  const schema = tool.inputSchema || {};
  const props = schema.properties || {};
  const required = schema.required || [];

  const formFields = Object.entries(props).map(([key, prop]) => {
    const isRequired = required.includes(key);
    const presetVal = presetParams?.get(key) ?? "";
    return renderField(key, prop, isRequired, presetVal);
  }).join("");

  const hasFields = Object.keys(props).length > 0;

  pane.innerHTML = `
    <h1>${prettyName(tool.name)}</h1>
    <p class="tool-desc">${escapeHtml(tool.description || "")}</p>
    <form id="tool-form">
      ${hasFields ? `<div class="form-grid">${formFields}</div>` : '<p style="color:var(--text-muted);margin:0;">No parameters required.</p>'}
      <div class="submit-row">
        <button type="submit" class="primary">Run query</button>
        <button type="button" class="secondary" id="copy-url">Copy shareable URL</button>
        <span id="form-status"></span>
      </div>
    </form>
    <div id="results-container"></div>
  `;

  document.getElementById("tool-form").onsubmit = e => {
    e.preventDefault();
    runQuery();
  };
  document.getElementById("copy-url").onclick = copyShareableUrl;

  // Update URL
  const newUrl = new URL(location.href);
  [...newUrl.searchParams.keys()].forEach(k => newUrl.searchParams.delete(k));
  newUrl.searchParams.set("tool", tool.name);
  if (presetParams) {
    for (const [k, v] of presetParams.entries()) {
      if (k !== "tool" && props[k]) newUrl.searchParams.set(k, v);
    }
  }
  history.replaceState(null, "", newUrl);

  // Auto-run if URL had params beyond just tool=
  if (presetParams && [...presetParams.keys()].some(k => k !== "tool")) {
    setTimeout(runQuery, 80);
  }
}

function renderField(key, prop, required, value) {
  const reqMark = required ? '<span class="req">*</span>' : "";
  const label = `<label>${prettyName(key)}${reqMark}</label>`;
  const tip = prop.description ? `<div class="field-tip">${escapeHtml(prop.description)}</div>` : "";
  let input = "";

  if (prop.enum) {
    const opts = prop.enum.map(v => `<option value="${escapeAttr(v)}"${v === value ? " selected" : ""}>${escapeHtml(v)}</option>`).join("");
    const defOpt = prop.default ? "" : `<option value="">—</option>`;
    input = `<select name="${key}">${defOpt}${opts}</select>`;
  } else if (prop.type === "boolean") {
    input = `<select name="${key}"><option value="">—</option><option value="true"${value === "true" ? " selected" : ""}>true</option><option value="false"${value === "false" ? " selected" : ""}>false</option></select>`;
  } else if (prop.type === "number") {
    const ph = prop.default != null ? ` placeholder="default: ${prop.default}"` : "";
    input = `<input type="number" name="${key}" value="${escapeAttr(value)}"${ph} step="any">`;
  } else {
    input = `<input type="text" name="${key}" value="${escapeAttr(value)}">`;
  }
  return `<div class="field">${label}${input}${tip}</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ============================================================
// Run query
// ============================================================
async function runQuery() {
  if (!currentTool) return;
  const form = document.getElementById("tool-form");
  const args = {};
  const fd = new FormData(form);
  const props = currentTool.inputSchema?.properties || {};

  for (const [key, val] of fd.entries()) {
    if (val === "" || val == null) continue;
    const prop = props[key];
    if (!prop) continue;
    if (prop.type === "number") {
      const n = Number(val);
      if (Number.isFinite(n)) args[key] = n;
    } else if (prop.type === "boolean") {
      args[key] = val === "true";
    } else {
      // string, oneOf, or untyped
      args[key] = val;
    }
  }

  // Update URL
  const newUrl = new URL(location.href);
  [...newUrl.searchParams.keys()].forEach(k => { if (k !== "tool") newUrl.searchParams.delete(k); });
  for (const [k, v] of Object.entries(args)) newUrl.searchParams.set(k, v);
  history.replaceState(null, "", newUrl);

  const status = document.getElementById("form-status");
  status.innerHTML = '<span class="loading"></span> Running…';

  try {
    const t0 = performance.now();
    const result = await rpc("tools/call", { name: currentTool.name, arguments: args });
    const ms = Math.round(performance.now() - t0);
    if (result.isError) {
      const msg = result.content?.[0]?.text || "Tool error";
      throw new Error(msg);
    }
    currentResult = result.structuredContent ?? safeParse(result.content?.[0]?.text);
    currentSort = { col: null, dir: "desc" };
    status.innerHTML = `<span style="color:var(--success);">✓ ${ms}ms</span>`;
    renderResults();
  } catch (e) {
    status.innerHTML = `<span style="color:var(--error);">✗ ${escapeHtml(e.message)}</span>`;
    document.getElementById("results-container").innerHTML = `<div class="error-banner">${escapeHtml(e.message)}</div>`;
  }
}

function safeParse(s) {
  if (!s) return null;
  try { return JSON.parse(s); } catch { return s; }
}

// ============================================================
// Result rendering
// ============================================================
function getPrimaryArray(result) {
  if (!result || typeof result !== "object") return null;
  if (Array.isArray(result.rows)) return { key: "rows", arr: result.rows };
  if (Array.isArray(result.organizations)) return { key: "organizations", arr: result.organizations };
  if (Array.isArray(result.filings)) return { key: "filings", arr: result.filings };
  return null;
}

function renderResults() {
  const container = document.getElementById("results-container");
  if (!currentResult) { container.innerHTML = ""; return; }

  // Empty / not-found states
  if (currentResult.row === null) {
    container.innerHTML = `<div class="results"><div class="empty-state">No matching record found.</div></div>`;
    return;
  }
  const arr = getPrimaryArray(currentResult);
  if (arr && arr.arr.length === 0) {
    container.innerHTML = `<div class="results"><div class="empty-state">No results — try adjusting filters.</div></div>`;
    return;
  }

  const totalCount = currentResult.total ?? currentResult.totalResults;
  const summary = arr
    ? `${arr.arr.length.toLocaleString()} row${arr.arr.length === 1 ? "" : "s"}${totalCount != null && totalCount !== arr.arr.length ? ` (of ${totalCount.toLocaleString()} total)` : ""}`
    : "Result";

  container.innerHTML = `
    <div class="results">
      <div class="results-header">
        <div class="results-summary">${summary}</div>
        <div class="view-toggle">
          <button data-view="table" class="${currentView === "table" ? "active" : ""}">Table</button>
          <button data-view="json" class="${currentView === "json" ? "active" : ""}">JSON</button>
        </div>
      </div>
      <div id="results-body"></div>
    </div>
  `;

  container.querySelectorAll(".view-toggle button").forEach(b => {
    b.onclick = () => { currentView = b.dataset.view; renderResults(); };
  });

  const body = document.getElementById("results-body");
  if (currentView === "json") {
    body.innerHTML = `<pre class="json">${escapeHtml(JSON.stringify(currentResult, null, 2))}</pre>`;
  } else if (arr) {
    body.innerHTML = renderTable(arr.arr);
    wireSorting();
  } else {
    // Single-object result: render top-level key/values, unwrapping common single-row containers
    const display = currentResult.row || currentResult.firm || currentResult.organization || currentResult;
    body.innerHTML = renderKeyValue(display);
  }
}

function renderTable(rows) {
  if (!rows.length) return `<div class="empty-state">No rows.</div>`;
  // Union of keys from first few rows to handle sparse rows
  const cols = Array.from(new Set(rows.slice(0, 20).flatMap(r => Object.keys(r))));
  const numCols = new Set(cols.filter(c => rows.some(r => typeof r[c] === "number")));

  // Sort
  let sorted = rows;
  if (currentSort.col) {
    sorted = [...rows].sort((a, b) => {
      const av = a[currentSort.col];
      const bv = b[currentSort.col];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      if (av < bv) return currentSort.dir === "asc" ? -1 : 1;
      if (av > bv) return currentSort.dir === "asc" ? 1 : -1;
      return 0;
    });
  }

  let html = `<div style="overflow:auto;max-height:600px;"><table><thead><tr>`;
  for (const c of cols) {
    const ind = currentSort.col === c ? `<span class="sort-ind">${currentSort.dir === "asc" ? "▲" : "▼"}</span>` : "";
    html += `<th data-col="${escapeAttr(c)}">${prettyName(c)}${ind}</th>`;
  }
  html += `</tr></thead><tbody>`;
  for (const row of sorted) {
    html += "<tr>";
    for (const c of cols) {
      const v = row[c];
      let txt = "";
      if (v == null) txt = "";
      else if (typeof v === "number") txt = formatNumber(c, v);
      else if (typeof v === "object") txt = JSON.stringify(v);
      else txt = String(v);
      const cls = numCols.has(c) ? ' class="num"' : "";
      html += `<td${cls} title="${escapeAttr(txt)}">${escapeHtml(txt)}</td>`;
    }
    html += "</tr>";
  }
  html += `</tbody></table></div>`;
  return html;
}

function wireSorting() {
  document.querySelectorAll("thead th").forEach(th => {
    th.onclick = () => {
      const col = th.dataset.col;
      if (currentSort.col === col) {
        currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
      } else {
        currentSort = { col, dir: "desc" };
      }
      renderResults();
    };
  });
}

function formatNumber(col, n) {
  if (/aum|amt|amount|revenue|income|assets|liab|expenses|gross|net.*value|fee|salary|comp|equity/i.test(col)) {
    return "$" + Math.round(n).toLocaleString();
  }
  if (Number.isInteger(n)) return n.toLocaleString();
  return n.toLocaleString(undefined, { maximumFractionDigits: 4 });
}

function renderKeyValue(obj) {
  if (typeof obj !== "object" || obj == null) return escapeHtml(String(obj));
  let html = `<dl class="kv">`;
  for (const [k, v] of Object.entries(obj)) {
    let dispV;
    if (v == null) dispV = `<span style="color:var(--text-muted);">—</span>`;
    else if (typeof v === "number") dispV = formatNumber(k, v);
    else if (Array.isArray(v)) {
      dispV = v.length === 0
        ? `<span style="color:var(--text-muted);">[empty]</span>`
        : `<details><summary>${v.length} item${v.length === 1 ? "" : "s"}</summary><pre class="json">${escapeHtml(JSON.stringify(v, null, 2))}</pre></details>`;
    }
    else if (typeof v === "object") {
      dispV = `<details><summary>${Object.keys(v).length} field${Object.keys(v).length === 1 ? "" : "s"}</summary><pre class="json">${escapeHtml(JSON.stringify(v, null, 2))}</pre></details>`;
    }
    else if (typeof v === "boolean") dispV = v ? "✓ true" : "false";
    else dispV = escapeHtml(String(v));
    html += `<dt>${prettyName(k)}</dt><dd>${dispV}</dd>`;
  }
  html += `</dl>`;
  return html;
}

function copyShareableUrl() {
  navigator.clipboard.writeText(location.href);
  const btn = document.getElementById("copy-url");
  const orig = btn.textContent;
  btn.textContent = "✓ Copied!";
  setTimeout(() => btn.textContent = orig, 1500);
}

// ============================================================
// Init
// ============================================================
async function init() {
  // Pull server version label (unauth GET endpoint)
  fetch(API).then(r => r.json()).then(j => {
    if (j.version) document.getElementById("server-version").textContent = "v" + j.version;
  }).catch(() => {});

  if (!getToken()) {
    showAuthModal();
  } else {
    try {
      await loadTools();
    } catch (e) {
      showAuthModal();
    }
  }
}
init();
</script>
