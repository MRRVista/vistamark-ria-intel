<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vistamark Intel — Query Console</title>
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; color: #0f172a; background: #f8f9fb; }
code, pre, .mono, table td, .field input, .field select, .tool-link, .field label, .metric-value, .elapsed { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

#app { display: grid; grid-template-rows: 48px 1fr; grid-template-columns: 280px 1fr; grid-template-areas: "header header" "sidebar content"; height: 100vh; }
header { grid-area: header; background: #0f172a; color: white; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.2px; }
header .signout { color: #94a3b8; background: none; border: 1px solid #334155; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
header .signout:hover { color: white; border-color: #64748b; }
header h1 span { color: #38bdf8; font-weight: 400; }

#sidebar { grid-area: sidebar; background: white; border-right: 1px solid #e2e6eb; padding: 16px 12px; overflow-y: auto; }
#sidebar h3 { font-size: 11px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 8px 6px; }
#sidebar h3:first-child { margin-top: 0; }
#sidebar ul { list-style: none; }
.tool-link { display: block; width: 100%; text-align: left; padding: 6px 10px; background: none; border: none; border-radius: 4px; cursor: pointer; font-size: 12.5px; color: #0f172a; }
.tool-link:hover { background: #f1f5f9; }
.tool-link.active { background: #0c4a6e; color: white; }

#content { grid-area: content; overflow-y: auto; padding: 24px; }
#content > * { max-width: 1240px; }
#tool-form, #results { background: white; border: 1px solid #e2e6eb; border-radius: 8px; padding: 24px; margin-bottom: 16px; }
#tool-form h2 { font-size: 20px; margin-bottom: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace; font-weight: 600; }
.tool-desc { color: #475569; margin-bottom: 20px; line-height: 1.55; font-size: 13px; }

.fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px 20px; }
.field label { display: block; font-weight: 500; font-size: 12px; margin-bottom: 4px; color: #334155; }
.field .req { color: #b91c1c; }
.field input[type="text"], .field input[type="number"], .field input[type="password"], .field select { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; background: white; }
.field input[type="checkbox"] { transform: scale(1.1); margin-right: 6px; }
.field input:focus, .field select:focus { outline: none; border-color: #0c4a6e; box-shadow: 0 0 0 3px rgba(12, 74, 110, 0.1); }
.field .help { color: #64748b; font-size: 11px; margin-top: 3px; line-height: 1.4; }

.actions { margin-top: 20px; display: flex; gap: 8px; flex-wrap: wrap; padding-top: 16px; border-top: 1px solid #e2e6eb; }
button.primary { background: #0c4a6e; color: white; padding: 8px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 500; }
button.primary:hover { background: #075985; }
button.primary:disabled { background: #94a3b8; cursor: wait; }
button.secondary { background: white; color: #0f172a; padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 5px; cursor: pointer; font-size: 13px; }
button.secondary:hover { background: #f8fafc; }

.results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid #e2e6eb; }
.results-header h3 { font-size: 15px; font-weight: 600; }
.elapsed { color: #64748b; font-weight: normal; font-size: 12px; margin-left: 8px; }
.view-toggle { display: flex; gap: 1px; background: #e2e6eb; padding: 2px; border-radius: 5px; }
.view-btn { background: white; border: none; padding: 4px 10px; cursor: pointer; font-size: 12px; border-radius: 4px; color: #475569; }
.view-btn.active { background: #0c4a6e; color: white; }

.summary { display: flex; flex-wrap: wrap; gap: 20px 28px; margin-bottom: 16px; padding: 12px 16px; background: #f8fafc; border-radius: 6px; border: 1px solid #f1f5f9; }
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; font-family: -apple-system, sans-serif; }
.metric-value { font-size: 13px; font-weight: 500; color: #0f172a; }

h4.section { font-size: 12px; font-weight: 600; color: #475569; text-transform: uppercase; letter-spacing: 0.6px; margin: 18px 0 8px; }
h4.section .count { color: #64748b; font-weight: 400; }

.table-wrap { overflow-x: auto; border: 1px solid #e2e6eb; border-radius: 5px; max-height: 600px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #f1f5f9; padding: 7px 10px; text-align: left; font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px; color: #475569; border-bottom: 1px solid #e2e6eb; position: sticky; top: 0; white-space: nowrap; font-family: -apple-system, sans-serif; }
td { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
td.empty { color: #cbd5e1; }
tr:hover td { background: #f8fafc; }
.kv-table th { width: 200px; text-align: right; padding-right: 16px; }
.kv-table td { white-space: normal; }

pre { background: #0f172a; color: #e2e8f0; padding: 14px; border-radius: 6px; overflow: auto; font-size: 11.5px; line-height: 1.5; max-height: 600px; }

.loading { color: #64748b; padding: 24px; text-align: center; font-style: italic; }
.empty-state { color: #94a3b8; padding: 24px; text-align: center; }
.error { background: #fef2f2; color: #991b1b; padding: 12px 16px; border-radius: 5px; border: 1px solid #fecaca; font-size: 13px; }
.error code { background: rgba(0,0,0,0.05); padding: 1px 4px; border-radius: 2px; }

#auth-modal { display: none; position: fixed; inset: 0; z-index: 1000; }
#auth-modal.open { display: block; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.6); display: flex; align-items: center; justify-content: center; }
.modal { background: white; border-radius: 8px; padding: 28px; max-width: 420px; width: 90%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); }
.modal h2 { margin-bottom: 10px; font-size: 18px; }
.modal p { color: #475569; margin-bottom: 16px; line-height: 1.5; font-size: 13px; }
.modal code { background: #f1f5f9; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
.modal input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; margin-bottom: 10px; font-family: ui-monospace, monospace; }
.modal input:focus { outline: none; border-color: #0c4a6e; box-shadow: 0 0 0 3px rgba(12, 74, 110, 0.1); }
.modal button.primary { width: 100%; padding: 10px; }

.flash { position: fixed; bottom: 20px; right: 20px; background: #047857; color: white; padding: 9px 16px; border-radius: 5px; opacity: 0; transform: translateY(8px); transition: all 0.2s ease; z-index: 100; font-size: 13px; }
.flash.show { opacity: 1; transform: translateY(0); }
.flash.error { background: #b91c1c; }

#welcome { color: #64748b; padding: 60px 24px; text-align: center; }
#welcome h2 { font-size: 18px; color: #334155; margin-bottom: 8px; font-weight: 600; }
#welcome p { font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Vistamark Intel <span>— Query Console</span></h1>
    <button class="signout" id="signout-btn">Sign out</button>
  </header>
  <nav id="sidebar"></nav>
  <main id="content">
    <div id="welcome">
      <h2>Pick a tool from the sidebar</h2>
      <p>Or paste a saved query URL to jump straight in.</p>
    </div>
    <section id="tool-form" style="display:none;"></section>
    <section id="results" style="display:none;"></section>
  </main>
</div>

<div id="auth-modal">
  <div class="modal-backdrop">
    <div class="modal">
      <h2>Sign in</h2>
      <p>Paste your <code>ACCESS_TOKEN</code> to query the MCP server. Stored only for this browser tab — closing it signs you out.</p>
      <form id="auth-form">
        <input type="password" id="token-input" placeholder="ACCESS_TOKEN" autofocus autocomplete="off">
        <div id="auth-error" class="error" style="display:none; margin-bottom: 10px;"></div>
        <button type="submit" class="primary">Sign in</button>
      </form>
    </div>
  </div>
</div>

<script>
"use strict";

const API = "/api/mcp";

const state = {
  token: sessionStorage.getItem("vmi_token") || null,
  tools: [],
  currentTool: null,
};

async function rpc(method, params) {
  const res = await fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + state.token,
    },
    body: JSON.stringify({ jsonrpc: "2.0", id: Date.now(), method, params: params || {} }),
  });
  if (res.status === 401) throw new Error("Unauthorized — bad ACCESS_TOKEN");
  if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text()).slice(0, 200));
  const body = await res.json();
  if (body.error) throw new Error("RPC " + body.error.code + ": " + body.error.message);
  return body.result;
}

async function loadTools() {
  const result = await rpc("tools/list");
  state.tools = result.tools || [];
  renderSidebar();
}

function renderSidebar() {
  const groups = { "RIA Intelligence": [], "Nonprofit Intelligence": [], "System": [] };
  for (const t of state.tools) {
    if (t.name === "database_status") groups["System"].push(t);
    else if (t.name.startsWith("propublica_") || t.name.startsWith("irs_")) groups["Nonprofit Intelligence"].push(t);
    else groups["RIA Intelligence"].push(t);
  }
  const sb = document.getElementById("sidebar");
  sb.innerHTML = Object.entries(groups)
    .filter(function (e) { return e[1].length > 0; })
    .map(function (entry) {
      const cat = entry[0], tools = entry[1];
      return "<h3>" + esc(cat) + "</h3><ul>" +
        tools.map(function (t) {
          return '<li><button class="tool-link" data-tool="' + esc(t.name) + '">' + esc(t.name) + "</button></li>";
        }).join("") + "</ul>";
    })
    .join("");
  sb.querySelectorAll(".tool-link").forEach(function (btn) {
    btn.addEventListener("click", function () { selectTool(btn.dataset.tool); });
  });
}

function selectTool(name) {
  const tool = state.tools.find(function (t) { return t.name === name; });
  if (!tool) return;
  state.currentTool = tool;
  const url = new URL(window.location);
  url.searchParams.set("tool", name);
  history.replaceState(null, "", url);
  document.querySelectorAll(".tool-link").forEach(function (btn) {
    btn.classList.toggle("active", btn.dataset.tool === name);
  });
  document.getElementById("welcome").style.display = "none";
  document.getElementById("results").style.display = "none";
  document.getElementById("results").innerHTML = "";
  renderForm(tool);
}

function renderForm(tool) {
  const schema = tool.inputSchema || {};
  const props = schema.properties || {};
  const required = schema.required || [];
  const urlParams = new URL(window.location).searchParams;

  const fields = Object.entries(props).map(function (entry) {
    const key = entry[0], def = entry[1];
    const isReq = required.indexOf(key) >= 0;
    const urlVal = urlParams.get(key);
    const initial = urlVal != null ? urlVal : (def["default"] != null ? def["default"] : "");
    const id = "field-" + key;
    let input;

    if (def["enum"]) {
      input = '<select id="' + id + '" name="' + esc(key) + '">' +
        '<option value="">(any)</option>' +
        def["enum"].map(function (v) {
          return '<option value="' + esc(v) + '"' + (String(v) === String(initial) ? " selected" : "") + ">" + esc(v) + "</option>";
        }).join("") + "</select>";
    } else if (def.type === "boolean") {
      input = '<input type="checkbox" id="' + id + '" name="' + esc(key) + '"' + (initial === true || initial === "true" ? " checked" : "") + ">";
    } else if (def.type === "number") {
      const max = def.maximum != null ? ' max="' + def.maximum + '"' : "";
      input = '<input type="number" id="' + id + '" name="' + esc(key) + '" value="' + esc(initial) + '"' + max + ">";
    } else {
      input = '<input type="text" id="' + id + '" name="' + esc(key) + '" value="' + esc(initial) + '">';
    }

    return '<div class="field"><label for="' + id + '">' + esc(key) +
      (isReq ? ' <span class="req">*</span>' : "") + "</label>" + input +
      (def.description ? '<p class="help">' + esc(def.description) + "</p>" : "") +
      "</div>";
  }).join("");

  document.getElementById("tool-form").style.display = "";
  document.getElementById("tool-form").innerHTML =
    "<h2>" + esc(tool.name) + "</h2>" +
    '<p class="tool-desc">' + esc(tool.description || "") + "</p>" +
    '<form id="query-form">' +
      (fields ? '<div class="fields-grid">' + fields + "</div>" : '<p class="empty-state">No parameters — just run.</p>') +
      '<div class="actions">' +
        '<button type="submit" class="primary" id="run-btn">Run query</button>' +
        '<button type="button" class="secondary" id="reset-btn">Reset</button>' +
        '<button type="button" class="secondary" id="curl-btn">Copy as curl</button>' +
        '<button type="button" class="secondary" id="link-btn">Copy share link</button>' +
      "</div>" +
    "</form>";

  document.getElementById("query-form").addEventListener("submit", function (e) {
    e.preventDefault();
    runQuery();
  });
  document.getElementById("reset-btn").addEventListener("click", function () {
    const u = new URL(window.location);
    const keep = u.searchParams.get("tool");
    u.search = "";
    if (keep) u.searchParams.set("tool", keep);
    history.replaceState(null, "", u);
    renderForm(tool);
  });
  document.getElementById("curl-btn").addEventListener("click", copyAsCurl);
  document.getElementById("link-btn").addEventListener("click", copyShareLink);
}

function gatherArgs() {
  const form = document.getElementById("query-form");
  const args = {};
  if (!form) return args;
  const props = state.currentTool.inputSchema.properties || {};
  for (let i = 0; i < form.elements.length; i++) {
    const el = form.elements[i];
    if (!el.name) continue;
    const def = props[el.name] || {};
    if (el.type === "checkbox") {
      if (el.checked) args[el.name] = true;
    } else if (el.value !== "") {
      if (def.type === "number") {
        const n = Number(el.value);
        if (!Number.isNaN(n)) args[el.name] = n;
      } else {
        args[el.name] = el.value;
      }
    }
  }
  return args;
}

async function runQuery() {
  const args = gatherArgs();
  syncUrl(args);
  const resultsEl = document.getElementById("results");
  resultsEl.style.display = "";
  resultsEl.innerHTML = '<div class="loading">Running query…</div>';
  const runBtn = document.getElementById("run-btn");
  if (runBtn) { runBtn.disabled = true; runBtn.textContent = "Running…"; }
  const start = Date.now();
  try {
    const result = await rpc("tools/call", { name: state.currentTool.name, arguments: args });
    renderResults(result, Date.now() - start);
  } catch (err) {
    resultsEl.innerHTML = '<div class="error"><strong>Query failed.</strong> ' + esc(err.message) + "</div>";
  } finally {
    if (runBtn) { runBtn.disabled = false; runBtn.textContent = "Run query"; }
  }
}

function syncUrl(args) {
  const url = new URL(window.location);
  const tool = url.searchParams.get("tool");
  url.search = "";
  if (tool) url.searchParams.set("tool", tool);
  Object.entries(args).forEach(function (e) { url.searchParams.set(e[0], String(e[1])); });
  history.replaceState(null, "", url);
}

function renderResults(result, elapsedMs) {
  const data = result && result.structuredContent;
  const resultsEl = document.getElementById("results");

  if (result && result.isError) {
    resultsEl.innerHTML = '<div class="error">' + esc((result.content && result.content[0] && result.content[0].text) || "Tool error") + "</div>";
    return;
  }
  if (!data) {
    resultsEl.innerHTML = '<div class="empty-state">No structured result. Raw:</div><pre>' + esc(JSON.stringify(result, null, 2)) + "</pre>";
    return;
  }

  const arrayFields = [];
  const objectFields = [];
  const primitiveFields = [];
  Object.entries(data).forEach(function (e) {
    const k = e[0], v = e[1];
    if (Array.isArray(v)) arrayFields.push([k, v]);
    else if (v && typeof v === "object") objectFields.push([k, v]);
    else primitiveFields.push([k, v]);
  });

  let html = '<div class="results-header">' +
    '<h3>Results <span class="elapsed">' + elapsedMs + "ms</span></h3>" +
    '<div class="view-toggle">' +
      '<button class="view-btn active" data-view="pretty">Pretty</button>' +
      '<button class="view-btn" data-view="json">JSON</button>' +
    "</div></div>" +
    '<div id="pretty-view">';

  if (primitiveFields.length > 0) {
    html += '<div class="summary">' + primitiveFields.map(function (e) {
      return '<div class="metric"><span class="metric-label">' + esc(e[0]) + "</span><span class=\"metric-value\">" + esc(formatValue(e[1])) + "</span></div>";
    }).join("") + "</div>";
  }
  objectFields.forEach(function (e) {
    html += '<h4 class="section">' + esc(e[0]) + "</h4>" + renderKv(e[1]);
  });
  arrayFields.forEach(function (e) {
    html += '<h4 class="section">' + esc(e[0]) + ' <span class="count">(' + e[1].length + ")</span></h4>" + renderTable(e[1]);
  });

  html += '</div><div id="json-view" style="display:none;"><pre>' + esc(JSON.stringify(data, null, 2)) + "</pre></div>";
  resultsEl.innerHTML = html;

  resultsEl.querySelectorAll(".view-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      const view = btn.dataset.view;
      resultsEl.querySelectorAll(".view-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
      document.getElementById("pretty-view").style.display = view === "pretty" ? "" : "none";
      document.getElementById("json-view").style.display = view === "json" ? "" : "none";
    });
  });
}

function renderKv(obj) {
  if (!obj || Object.keys(obj).length === 0) return '<div class="empty-state">(empty)</div>';
  return '<div class="table-wrap"><table class="kv-table"><tbody>' +
    Object.entries(obj).map(function (e) {
      const v = e[1];
      let cell;
      if (v && typeof v === "object") cell = '<code>' + esc(JSON.stringify(v)) + '</code>';
      else cell = esc(formatValue(v));
      return "<tr><th>" + esc(e[0]) + "</th><td>" + cell + "</td></tr>";
    }).join("") + "</tbody></table></div>";
}

function renderTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty-state">No rows.</div>';
  if (typeof rows[0] !== "object" || rows[0] === null) {
    return '<div class="table-wrap"><table><tbody>' +
      rows.map(function (v) { return "<tr><td>" + esc(formatValue(v)) + "</td></tr>"; }).join("") +
      "</tbody></table></div>";
  }
  const keys = [];
  const seen = new Set();
  rows.forEach(function (r) {
    Object.keys(r || {}).forEach(function (k) { if (!seen.has(k)) { seen.add(k); keys.push(k); } });
  });
  return '<div class="table-wrap"><table><thead><tr>' +
    keys.map(function (k) { return "<th>" + esc(k) + "</th>"; }).join("") + "</tr></thead><tbody>" +
    rows.map(function (r) {
      return "<tr>" + keys.map(function (k) {
        const v = r ? r[k] : undefined;
        if (v == null) return '<td class="empty"></td>';
        if (typeof v === "object") return "<td><code>" + esc(JSON.stringify(v)) + "</code></td>";
        return "<td>" + esc(formatValue(v)) + "</td>";
      }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
}

function formatValue(v) {
  if (v == null) return "";
  if (typeof v === "boolean") return v ? "✓" : "—";
  if (typeof v === "number") {
    if (Number.isInteger(v) && Math.abs(v) >= 1000) return v.toLocaleString();
    return String(v);
  }
  if (typeof v === "object") return JSON.stringify(v);
  return String(v);
}

function esc(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
  });
}

async function copyAsCurl() {
  const args = gatherArgs();
  const body = JSON.stringify({ jsonrpc: "2.0", id: 1, method: "tools/call", params: { name: state.currentTool.name, arguments: args } });
  const curl = 'curl -X POST "' + window.location.origin + '/api/mcp" \\\n' +
    '  -H "Content-Type: application/json" \\\n' +
    '  -H "Authorization: Bearer $ACCESS_TOKEN" \\\n' +
    "  -d '" + body.replace(/'/g, "'\\''") + "'";
  try { await navigator.clipboard.writeText(curl); flash("curl command copied"); }
  catch (err) { flash("Copy failed: " + err.message, true); }
}

async function copyShareLink() {
  const args = gatherArgs();
  syncUrl(args);
  try { await navigator.clipboard.writeText(window.location.href); flash("link copied"); }
  catch (err) { flash("Copy failed: " + err.message, true); }
}

function flash(msg, isErr) {
  const el = document.createElement("div");
  el.className = "flash" + (isErr ? " error" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(function () { el.classList.add("show"); });
  setTimeout(function () {
    el.classList.remove("show");
    setTimeout(function () { el.remove(); }, 250);
  }, 1700);
}

function showAuthModal() {
  document.getElementById("auth-modal").classList.add("open");
  setTimeout(function () { document.getElementById("token-input").focus(); }, 30);
}

function hideAuthModal() {
  document.getElementById("auth-modal").classList.remove("open");
}

function signOut() {
  sessionStorage.removeItem("vmi_token");
  state.token = null;
  state.tools = [];
  state.currentTool = null;
  document.getElementById("sidebar").innerHTML = "";
  document.getElementById("tool-form").style.display = "none";
  document.getElementById("tool-form").innerHTML = "";
  document.getElementById("results").style.display = "none";
  document.getElementById("results").innerHTML = "";
  document.getElementById("welcome").style.display = "";
  showAuthModal();
}

document.getElementById("auth-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  const token = document.getElementById("token-input").value.trim();
  if (!token) return;
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  state.token = token;
  try {
    await loadTools();
    sessionStorage.setItem("vmi_token", token);
    hideAuthModal();
    document.getElementById("token-input").value = "";
    const urlTool = new URL(window.location).searchParams.get("tool");
    if (urlTool) selectTool(urlTool);
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = "block";
    state.token = null;
  }
});

document.getElementById("signout-btn").addEventListener("click", signOut);

(async function init() {
  if (state.token) {
    try {
      await loadTools();
      const urlTool = new URL(window.location).searchParams.get("tool");
      if (urlTool) selectTool(urlTool);
    } catch (err) {
      console.error("Init failed:", err);
      signOut();
    }
  } else {
    showAuthModal();
  }
})();
</script>
</body>
